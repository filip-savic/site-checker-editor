<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard</title>
  <style>
    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f6f8fa;
      --bg-tertiary: #e1e4e8;
      --text-primary: #24292f;
      --text-secondary: #57606a;
      --text-heading: #1f2328;
      --border: #d0d7de;
      --link: #0969da;
      --btn-bg: #f3f4f6;
      --btn-hover: #e1e4e8;
      --focus-ring: rgba(9,105,218,0.15);
      --unsaved-bg: #bf8700;
      --unsaved-text: #ffffff;
      --overlay-bg: rgba(0,0,0,0.3);
    }
    [data-theme="dark"] {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --text-heading: #f0f6fc;
      --border: #30363d;
      --link: #58a6ff;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
      --focus-ring: rgba(88,166,255,0.15);
      --unsaved-bg: #d29922;
      --unsaved-text: #0d1117;
      --overlay-bg: rgba(0,0,0,0.6);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { cursor: pointer; font-family: inherit; font-size: 14px; border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; background: var(--btn-bg); color: var(--text-primary); transition: background 0.15s; }
    button:hover { background: var(--btn-hover); }
    button.primary { background: #238636; border-color: #238636; color: #fff; }
    button.primary:hover { background: #2ea043; }
    button.danger { background: #da3633; border-color: #da3633; color: #fff; }
    button.danger:hover { background: #f85149; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input, textarea { font-family: inherit; font-size: 14px; background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; width: 100%; }
    input:focus, textarea:focus { outline: none; border-color: var(--link); box-shadow: 0 0 0 3px var(--focus-ring); }
    textarea { resize: vertical; min-height: 60px; }

    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 80px 16px 0; border-bottom: 1px solid var(--bg-tertiary); margin-bottom: 24px; }
    header h1 { font-size: 20px; font-weight: 600; }

    #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; }
    #auth-screen h2 { font-size: 24px; margin-bottom: 8px; }
    #auth-screen p { color: var(--text-secondary); font-size: 14px; max-width: 440px; text-align: center; }
    .auth-form { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 500px; }
    .auth-row { display: flex; gap: 8px; }
    .auth-row input { flex: 1; }
    .auth-error { color: #f85149; font-size: 13px; }
    .auth-options { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
    .auth-options input[type="checkbox"] { width: auto; }

    #editor-screen { display: none; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
    .toolbar .spacer { flex: 1; }
    .unsaved-badge { background: var(--unsaved-bg); color: var(--unsaved-text); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }

    .site-card { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; background: var(--bg-secondary); }
    .site-card.editing { border-color: var(--link); }
    .site-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .site-name { font-size: 16px; font-weight: 600; color: var(--text-heading); }
    .site-url { font-size: 13px; color: var(--text-secondary); word-break: break-all; }
    .site-watch { font-size: 14px; color: var(--text-primary); margin-top: 8px; white-space: pre-wrap; }
    .site-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .site-actions button { font-size: 12px; padding: 4px 10px; }
    .site-card[draggable="true"] { cursor: grab; }
    .site-card.dragging { opacity: 0.4; }
    .site-card.drag-over { border-top: 2px solid var(--link); margin-top: -2px; }

    .edit-form { display: flex; flex-direction: column; gap: 10px; }
    .edit-form label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .edit-form .field { display: flex; flex-direction: column; gap: 4px; }
    .edit-form .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

    .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 100; animation: fadeIn 0.2s; }
    .toast.success { background: #238636; color: #fff; }
    .toast.error { background: #da3633; color: #fff; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-secondary); }
    .empty-state p { margin-bottom: 16px; }

    .overlay { position: fixed; inset: 0; background: var(--overlay-bg); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .dialog { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 400px; width: 90%; }
    .dialog h3 { margin-bottom: 12px; }
    .dialog p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
    .dialog .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .theme-toggle { position: absolute; top: 16px; right: 20px; z-index: 10; font-size: 13px; padding: 4px 10px; }
    .save-floating { position: fixed; bottom: 20px; right: 20px; z-index: 10; font-size: 14px; padding: 8px 20px; }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle"></button>
  <button class="primary save-floating" id="save-btn" disabled>Save<span class="unsaved-badge" id="unsaved-badge" style="display:none">Unsaved</span></button>

  <div class="container">
    <div id="auth-screen">
      <h2>Dashboard</h2>
      <p>Connect to get started. Provide your access token and target resource below.</p>
      <div class="auth-form">
        <div class="auth-row">
          <input type="password" id="token-input" placeholder="Access token" autocomplete="off">
          <button class="primary" id="connect-btn">Connect</button>
        </div>
        <input type="text" id="repo-input" placeholder="owner/repo" autocomplete="off">
        <input type="text" id="file-input" placeholder="path/to/file.json" value="sites.json" autocomplete="off">
      </div>
      <div class="auth-options">
        <input type="checkbox" id="remember-me" checked>
        <label for="remember-me">Remember me</label>
      </div>
      <div class="auth-error" id="auth-error"></div>
    </div>

    <div id="editor-screen">
      <header>
        <h1 id="editor-title">Dashboard</h1>
        <button id="disconnect-btn">Disconnect</button>
      </header>
      <div class="toolbar">
        <button class="primary" id="add-btn">+ Add Item</button>
      </div>
      <div id="sites-list"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://api.github.com';
    const SK = '_dt';
    const TK = '_theme';

    let token = '';
    let repo = '';
    let filePath = '';
    let sites = [];
    let fileSha = '';
    let hasUnsaved = false;
    let editingIndex = -1;

    // Theme
    function initTheme() {
      const saved = localStorage.getItem(TK) || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeButton(saved);
    }
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem(TK, next);
      updateThemeButton(next);
    }
    function updateThemeButton(theme) {
      document.getElementById('theme-toggle').textContent = theme === 'dark' ? '\u2600\uFE0F Light' : '\uD83C\uDF19 Dark';
    }
    initTheme();
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

    function getStored() {
      try {
        const raw = localStorage.getItem(SK) || sessionStorage.getItem(SK);
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }
    function store(data, remember) {
      const s = JSON.stringify(data);
      if (remember) { localStorage.setItem(SK, s); } else { sessionStorage.setItem(SK, s); }
    }
    function clearStored() {
      localStorage.removeItem(SK);
      sessionStorage.removeItem(SK);
    }

    async function apiGet(path) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.v3+json' },
        referrerPolicy: 'no-referrer'
      });
      if (!res.ok) throw new Error(`${res.status}`);
      return res.json();
    }

    async function apiPut(path, body) {
      const res = await fetch(`${API_BASE}${path}`, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        referrerPolicy: 'no-referrer'
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(`${res.status}: ${err.message || 'Unknown error'}`);
      }
      return res.json();
    }

    async function loadSites() {
      const data = await apiGet(`/repos/${repo}/contents/${filePath}`);
      fileSha = data.sha;
      const binary = atob(data.content.replace(/\n/g, ''));
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      const content = new TextDecoder().decode(bytes);
      sites = JSON.parse(content);
      return sites;
    }

    async function saveSites() {
      const json = JSON.stringify(sites, null, 2) + '\n';
      const bytes = new TextEncoder().encode(json);
      const content = btoa(String.fromCharCode(...bytes));
      const data = await apiPut(`/repos/${repo}/contents/${filePath}`, {
        message: 'Update config via dashboard',
        content: content,
        sha: fileSha
      });
      fileSha = data.content.sha;
    }

    function showToast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function setUnsaved(val) {
      hasUnsaved = val;
      document.getElementById('save-btn').disabled = !val;
      document.getElementById('unsaved-badge').style.display = val ? 'inline' : 'none';
    }

    function confirm(title, message) {
      return new Promise(resolve => {
        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        const dialog = document.createElement('div');
        dialog.className = 'dialog';
        const h3 = document.createElement('h3');
        h3.textContent = title;
        const p = document.createElement('p');
        p.textContent = message;
        const actions = document.createElement('div');
        actions.className = 'dialog-actions';
        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = 'Cancel';
        cancelBtn.onclick = () => { overlay.remove(); resolve(false); };
        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'danger';
        confirmBtn.textContent = 'Delete';
        confirmBtn.onclick = () => { overlay.remove(); resolve(true); };
        actions.append(cancelBtn, confirmBtn);
        dialog.append(h3, p, actions);
        overlay.appendChild(dialog);
        document.body.appendChild(overlay);
        overlay.onclick = (e) => { if (e.target === overlay) { overlay.remove(); resolve(false); } };
      });
    }

    function renderSites() {
      const list = document.getElementById('sites-list');

      if (sites.length === 0) {
        list.innerHTML = '<div class="empty-state"><p>No items configured yet.</p><button class="primary" onclick="addSite()">+ Add your first item</button></div>';
        return;
      }

      list.innerHTML = sites.map((site, i) => {
        if (i === editingIndex) {
          return renderEditCard(site, i);
        }
        return `
          <div class="site-card" data-index="${i}" draggable="true">
            <div class="site-header">
              <div>
                <div class="site-name">${esc(site.name || site.url)}</div>
                <div class="site-url"><a href="${safeHref(site.url)}" target="_blank" rel="noopener">${esc(site.url)}</a></div>
              </div>
              <div class="site-actions">
                <button onclick="editSite(${i})">Edit</button>
                <button onclick="copySite(${i})">Copy</button>
                <button onclick="deleteSite(${i})">Delete</button>
              </div>
            </div>
            <div class="site-watch">${esc(site.watch)}</div>
          </div>`;
      }).join('');
      initDragAndDrop();
    }

    let dragFromIndex = -1;

    function initDragAndDrop() {
      const cards = document.querySelectorAll('.site-card[draggable="true"]');
      cards.forEach(card => {
        card.addEventListener('dragstart', (e) => {
          dragFromIndex = parseInt(card.dataset.index);
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
          dragFromIndex = -1;
        });
        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
          if (parseInt(card.dataset.index) !== dragFromIndex) {
            card.classList.add('drag-over');
          }
        });
        card.addEventListener('dragleave', () => {
          card.classList.remove('drag-over');
        });
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          card.classList.remove('drag-over');
          const toIndex = parseInt(card.dataset.index);
          if (dragFromIndex === -1 || dragFromIndex === toIndex) return;
          const [moved] = sites.splice(dragFromIndex, 1);
          sites.splice(toIndex, 0, moved);
          setUnsaved(true);
          renderSites();
        });
      });
    }

    function renderEditCard(site, i) {
      return `
        <div class="site-card editing" data-index="${i}">
          <div class="edit-form">
            <div class="field">
              <label>Name</label>
              <input type="text" id="edit-name" value="${esc(site.name)}">
            </div>
            <div class="field">
              <label>URL</label>
              <input type="url" id="edit-url" value="${esc(site.url)}">
            </div>
            <div class="field">
              <label>Watch Instructions</label>
              <textarea id="edit-watch" rows="3">${esc(site.watch)}</textarea>
            </div>
            <div class="form-actions">
              <button onclick="cancelEdit()">Cancel</button>
              <button class="primary" onclick="saveEdit(${i})">Done</button>
            </div>
          </div>
        </div>`;
    }

    function esc(str) {
      const el = document.createElement('span');
      el.textContent = str || '';
      return el.innerHTML;
    }

    function safeHref(url) {
      try { const u = new URL(url); if (u.protocol === 'https:' || u.protocol === 'http:') return esc(url); }
      catch {}
      return '#';
    }

    function addSite() {
      sites.push({ name: '', url: '', watch: '' });
      editingIndex = sites.length - 1;
      setUnsaved(true);
      renderSites();
      document.getElementById('edit-name').focus();
    }

    function editSite(i) {
      editingIndex = i;
      renderSites();
      document.getElementById('edit-name').focus();
    }

    function isValidUrl(str) {
      try { const u = new URL(str); return u.protocol === 'https:' || u.protocol === 'http:'; }
      catch { return false; }
    }

    function saveEdit(i) {
      const name = document.getElementById('edit-name').value.trim();
      const url = document.getElementById('edit-url').value.trim();
      const watch = document.getElementById('edit-watch').value.trim();

      if (!url) {
        showToast('URL is required', 'error');
        return;
      }
      if (!isValidUrl(url)) {
        showToast('URL must be a valid http:// or https:// address', 'error');
        return;
      }

      sites[i] = { name, url, watch };
      editingIndex = -1;
      setUnsaved(true);
      renderSites();
    }

    function cancelEdit() {
      if (editingIndex >= 0) {
        const site = sites[editingIndex];
        if (!site.url) {
          sites.splice(editingIndex, 1);
        }
      }
      editingIndex = -1;
      renderSites();
    }

    function copySite(i) {
      const copy = { ...sites[i], name: sites[i].name + ' (copy)' };
      sites.splice(i + 1, 0, copy);
      setUnsaved(true);
      renderSites();
    }

    async function deleteSite(i) {
      const ok = await confirm('Delete item', `Remove "${sites[i].name}"?`);
      if (!ok) return;
      sites.splice(i, 1);
      setUnsaved(true);
      renderSites();
    }

    async function connect() {
      const error = document.getElementById('auth-error');
      const btn = document.getElementById('connect-btn');
      const remember = document.getElementById('remember-me').checked;

      token = document.getElementById('token-input').value.trim();
      repo = document.getElementById('repo-input').value.trim();
      filePath = document.getElementById('file-input').value.trim() || 'sites.json';

      if (!token) { error.textContent = 'Access token is required.'; return; }
      if (!repo || !repo.includes('/')) { error.textContent = 'Enter a valid owner/repo.'; return; }

      btn.disabled = true;
      btn.textContent = 'Connecting...';
      error.textContent = '';

      try {
        await loadSites();
        store({ t: token, r: repo, f: filePath }, remember);
        showEditor();
      } catch (e) {
        if (e.message.startsWith('401')) {
          error.textContent = 'Invalid token or insufficient permissions.';
        } else if (e.message.startsWith('404')) {
          error.textContent = 'Resource not found. Check your inputs.';
        } else {
          error.textContent = `Connection failed: ${e.message}`;
        }
        token = '';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    }

    function disconnect() {
      if (hasUnsaved && !window.confirm('You have unsaved changes. Disconnect anyway?')) return;
      token = '';
      repo = '';
      filePath = '';
      sites = [];
      fileSha = '';
      editingIndex = -1;
      setUnsaved(false);
      clearStored();
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('editor-screen').style.display = 'none';
      document.getElementById('token-input').value = '';
    }

    function showEditor() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('editor-screen').style.display = 'block';
      renderSites();
    }

    async function handleSave() {
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.firstChild.textContent = 'Saving... ';

      try {
        await saveSites();
        setUnsaved(false);
        showToast('Saved successfully');
      } catch (e) {
        if (e.message.startsWith('409')) {
          showToast('Conflict: resource was modified externally. Reloading...', 'error');
          await loadSites();
          renderSites();
        } else if (e.message.startsWith('401')) {
          showToast('Token expired or revoked. Please reconnect.', 'error');
          disconnect();
        } else {
          showToast(`Save failed: ${e.message}`, 'error');
        }
      } finally {
        btn.firstChild.textContent = 'Save';
      }
    }

    document.getElementById('connect-btn').addEventListener('click', connect);
    document.getElementById('token-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
    document.getElementById('disconnect-btn').addEventListener('click', disconnect);
    document.getElementById('save-btn').addEventListener('click', handleSave);
    document.getElementById('add-btn').addEventListener('click', addSite);

    window.addEventListener('beforeunload', (e) => {
      if (hasUnsaved) { e.preventDefault(); e.returnValue = ''; }
    });

    (async () => {
      const stored = getStored();
      if (stored && stored.t && stored.r) {
        token = stored.t;
        repo = stored.r;
        filePath = stored.f || 'sites.json';
        try {
          await loadSites();
          showEditor();
        } catch {
          clearStored();
          token = '';
          repo = '';
          filePath = '';
        }
      }
    })();
  </script>
</body>
</html>
